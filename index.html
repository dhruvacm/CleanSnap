<!doctype html>
<html lang="en">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- App Title -->
    <title>CleanSnap</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="CleanSnap is an AI-powered civic cleanliness reporting platform that helps communities report, track, and resolve real-world cleanliness issues."
    />

    <meta name="author" content="Dhruva CM" />

    <!-- CleanSnap Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <meta
      property="og:description"
      content="Report. Track. Improve your city with AI."

      content="AI-powered civic cleanliness reporting platform."
    />
